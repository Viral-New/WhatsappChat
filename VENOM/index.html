    <style>
        @font-face {
            font-family: "Lato";
            src: url("https://media.bio.site/public/library/fonts/lato.ttf") format("truetype");
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #fff;
            color: #000;
            font-family: "Lato", Arial, sans-serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            padding: 40px 20px 70px;
        }

        /* PROFILE */
        .profile {
            text-align: center;
            margin-bottom: 28px;
        }

        .profile-image {
            width: 96px;
            height: 96px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .profile-name {
            font-size: 26px;
            font-weight: 700;
        }

        /* LINKS */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            min-height: 76px;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 18px 10px 10px;
            color: #010101;
            background: #fff;
            border: 1px solid rgba(0,0,0,.08);
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,.06);
            text-decoration: none;
            transition: .18s ease;
        }

        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 22px rgba(0,0,0,.10);
        }

        .thumbnail {
            width: 56px;
            height: 56px;
            flex: 0 0 56px;
            object-fit: cover;
            border-radius: 10px;
        }

        .link-name {
            font-size: 17px;
            font-weight: 700;
        }

        /* BANNER TEXT */
        .banner-text {
            text-align: center;
            padding: 14px 18px;
            margin: 18px 0 12px;
            border-radius: 12px;
        }

        .banner-text-top {
            background: #f7f7f7;
            border: 1px solid rgba(0,0,0,.07);
        }

        .banner-text-bottom {
            margin-top: 8px;
            margin-bottom: 18px;
        }

        .banner-text p {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .banner-text span {
            display: block;
            font-size: 13px;
            line-height: 1.5;
            color: rgba(0,0,0,.60);
        }

        /* AD */
        .ad-slot {
            width: 100%;
            margin: 18px 0;
            text-align: center;
        }

        .ad-label {
            display: none;
            margin-bottom: 6px;
            font-size: 10px;
            color: #999;
        }

        #social-bar-slot {
            width: 100%;
            min-height: 0;
        }

        /* FOOTER */
        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: rgba(0,0,0,.45);
        }

        /* MOBILE */
        @media (max-width: 480px) {
            .container {
                padding: 28px 14px 55px;
            }

            .profile-image {
                width: 88px;
                height: 88px;
            }

            .profile-name {
                font-size: 23px;
            }

            .link-name {
                font-size: 16px;
            }

            .banner-text p {
                font-size: 15px;
            }

            .banner-text span {
                font-size: 12px;
            }
        }
    </style>
